AutoName: Senda
Summary: Free and private web browser built on GeckoView
Description: |-
  Senda is a free web browser for Android built on Mozilla's GeckoView engine.
  * Strict tracking protection, built-in uBlock Origin, HTTPS-only mode and DNS over HTTPS.
  * Built-in Tor network (optional) or your own proxy.
  * Password vault encrypted on the phone, unlocked with fingerprint or PIN.
  * Reader mode and on-device translation.
  * No telemetry. Interface in 8 languages.

  Alpha version: tested on a single phone model.

