AutoName: Senda
Summary: Navegador web libre y privado basado en GeckoView
Description: |-
  Senda es un navegador web libre para Android con el motor GeckoView de Mozilla.
  * Protección estricta contra rastreo, uBlock Origin integrado, solo HTTPS y DNS sobre HTTPS.
  * Red Tor integrada (opcional) o proxy propio.
  * Bóveda de contraseñas cifrada en el teléfono, con huella o PIN.
  * Modo lectura y traducción en el propio teléfono.
  * Sin telemetría. Interfaz en 8 idiomas.

  Versión alfa: probada en un solo modelo de teléfono.

