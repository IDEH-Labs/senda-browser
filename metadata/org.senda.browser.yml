AutoName: Senda
Summary: Navegador web ético, personalizable y sin rastreo basado en GeckoView
Description: |-
  Senda es un navegador web móvil soberano que te devuelve el control absoluto.
  Construido con el motor GeckoView y con la filosofía de LibreWolf:
  * Sin telemetría ni rastreo comercial (sin PPA).
  * Personalización visual total (barra reubicable, colores hex, modo OLED).
  * Consola web y DevTools en el propio teléfono.
  * Instalación libre de extensiones .xpi locales sin restricciones de cuentas.
  * Bloqueo opcional por huella dactilar y protección de pantalla.

