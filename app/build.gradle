plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

import java.util.Properties

// Release signing: environment variables (KEYSTORE_PATH, KEY_ALIAS, STORE_PASSWORD, KEY_PASSWORD) or keystore.properties
// in the project root (not committed). Without them the release build is UNSIGNED, never signed with the debug key
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.isFile()) signingPropertiesFile.withInputStream { signingProperties.load(it) }

def releaseKeystorePath = System.getenv('KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile')
def releaseKeyAlias = System.getenv('KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def releaseStorePassword = System.getenv('STORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def releaseKeyPassword = System.getenv('KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')

def releaseSigningConfigured = [releaseKeystorePath, releaseKeyAlias, releaseStorePassword, releaseKeyPassword].every { it?.trim() }

android {
    namespace 'org.senda.browser'
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId 'org.senda.browser'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.2.0-beta.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Only the 8 languages Senda is translated into: libraries bring texts in ~80 more that the app never shows
    androidResources {
        localeFilters += ['es', 'en', 'de', 'fr', 'pt', 'it', 'ja', 'zh']
    }

    // Play Store app bundles split resources by language; Senda changes its language inside the app, so every
    // one of its 8 languages must be installed
    bundle {
        language {
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    // No encrypted dependency block for Google: the APK carries no metadata the user cannot read
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    testOptions {
        // android.util.Log in JVM tests: returns 0 instead of throwing
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        lintConfig file("lint.xml")
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
            // License notices of the dependencies (Apache 2.0 requires distributing them): merged, not discarded
            merges += ['/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt']
        }
    }

    ndkVersion "26.1.10909125"

}

apply from: 'bundled-assets.gradle'

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
        force 'androidx.activity:activity-compose:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
        force 'androidx.lifecycle:lifecycle-common:2.8.7'
        force 'androidx.lifecycle:lifecycle-runtime:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'

        // GeckoView's WebAuthn code pulls in Google's proprietary Play Services client libraries. microG's
        // client libraries (Apache 2.0) provide the same API, so the APK carries no proprietary code
        dependencySubstitution {
            ['play-services-fido', 'play-services-base', 'play-services-basement', 'play-services-tasks'].each { name ->
                substitute module("com.google.android.gms:${name}") using module("org.microg.gms:${name}:0.3.14.250932")
            }
        }
    }
}

dependencies {
    // GeckoView - Mozilla's free web engine
    implementation 'org.mozilla.geckoview:geckoview:157.0.20261005135250'

    // AndroidX & Kotlin
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Biometrics (hardware keystore)
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Hidden API bypass for GeckoView JNI on Android 9-15
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // Embedded native Tor (Guardian Project)
    implementation 'info.guardianproject:tor-android:0.4.9.13'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Encrypted backups in the open age format: scrypt, ChaCha20-Poly1305, HKDF (vetted primitives, Maven Central)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (android.jar only has stubs)
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
