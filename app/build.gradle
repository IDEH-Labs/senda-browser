plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

import java.util.Properties

// Firma de publicación: variables de entorno (ver ~/.local/share/jpi59/senda-signing.env) o keystore.properties
// en la raíz del proyecto (no se sube a git). Sin ellas, la release sale SIN FIRMAR, nunca con la clave de depuración
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.isFile()) signingPropertiesFile.withInputStream { signingProperties.load(it) }

def releaseKeystorePath = System.getenv('KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile')
def releaseKeyAlias = System.getenv('KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def releaseStorePassword = System.getenv('STORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def releaseKeyPassword = System.getenv('KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')

def releaseSigningConfigured = [releaseKeystorePath, releaseKeyAlias, releaseStorePassword, releaseKeyPassword].every { it?.trim() }

android {
    namespace 'org.senda.browser'
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId 'org.senda.browser'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-alpha'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    // Sin el bloque de dependencias cifrado para Google: el APK no lleva metadatos que el usuario no puede leer
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
            // Avisos de licencia de las dependencias (Apache 2.0 exige distribuirlos): se combinan, no se descartan
            merges += ['/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt']
        }
    }

    ndkVersion "26.1.10909125"

}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
        force 'androidx.activity:activity-compose:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
        force 'androidx.lifecycle:lifecycle-common:2.8.7'
        force 'androidx.lifecycle:lifecycle-runtime:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
        force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    }
}

dependencies {
    // GeckoView - Motor web libre de Mozilla
    implementation 'org.mozilla.geckoview:geckoview:157.0.20260924084938'

    // AndroidX & Kotlin
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Biometría (Hardware Keystore)
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Hidden API bypass para JNI de GeckoView en Android 9-15
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // Tor Nativo Embebido Soberano (Guardian Project)
    implementation 'info.guardianproject:tor-android:0.4.9.13'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
