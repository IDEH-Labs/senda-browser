<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
        <linearGradient id="senda-curve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2dd4bf"/>
          <stop offset="50%" stop-color="#00d2a0"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <radialGradient id="senda-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00d2a0" stop-opacity="0.35"/>
          <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
        </radialGradient>
        
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Senda Aurora Outer Ambient Halo -->
        <circle cx="256" cy="256" r="160" fill="url(#senda-halo)"/>
        
        <!-- Outer Glowing Accent Rings -->
        <circle cx="256" cy="256" r="148" fill="none" stroke="#00d2a0" stroke-width="3" opacity="0.4"/>
        
        <!-- Senda S-Curve in official brand style -->
        <path d="M 306 170 C 306 135 272 120 230 120 C 180 120 154 145 154 188 C 154 238 204 256 254 272 C 314 290 348 316 348 358 C 348 408 296 434 236 434 C 176 434 142 400 142 358"
              fill="none" stroke="url(#senda-curve-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop-shadow)"/>
        
</svg>